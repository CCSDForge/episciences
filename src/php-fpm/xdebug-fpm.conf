; PHP-FPM pool settings for step-debugging, mounted by docker-compose.xdebug.yml (make up-xdebug)
; as php-fpm.d/zz-xdebug.conf, so that it is read after the other pool files.
;
; Every web request starts a debugging session. Console scripts are not concerned: they keep
; the default (trigger) and connect only with XDEBUG_TRIGGER=1, e.g.
;   docker compose exec -e XDEBUG_TRIGGER=1 php-fpm php scripts/<script>.php
; The value is quoted: unquoted, PHP-FPM would turn "yes" into "1".
[www]
php_admin_value[xdebug.start_with_request] = "yes"
