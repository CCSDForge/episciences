[xdebug]
; Installed but off: every PHP process (web, console, tests, workers) runs without Xdebug overhead,
; and phpunit's #[RunInSeparateProcess] children do not try to reach an IDE.
; The XDEBUG_MODE environment variable overrides this value:
; - make up-xdebug (docker-compose.xdebug.yml) sets it to "debug" for step-debugging;
; - the coverage targets of the Makefile set it to "coverage".
; The other step-debugging settings live in docker-compose.xdebug.yml and src/php-fpm/xdebug-fpm.conf.
xdebug.mode=off
