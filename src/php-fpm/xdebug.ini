[xdebug]
;zend_extension=xdebug.so
xdebug.mode=${XDEBUG_MODE:-off}
xdebug.start_with_request=yes
; host.docker.internal works on Linux too (extra_hosts: host-gateway)
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
;xdebug.idekey=PHPSTORM ; not used in modern configuration
;xdebug.discover_client_host = 1
xdebug.log_level=7
xdebug.profiler_append=0
xdebug.output_dir=/var/www/xdebug
xdebug.log=/var/www/htdocs/logs/xdebug.log
xdebug.profiler_output_name=cachegrind.out.%s.%H.%R






