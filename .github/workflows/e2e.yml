name: End-to-End Tests (Playwright)

on:
  pull_request:
    # *-epi-manager: the journal is served under its code (/dev/...), see APP_MODE below
    branches: [ staging, main, main-epi-manager, preprod-epi-manager ]
    # ready_for_review: a draft pull request is tested once it is marked ready
    types: [ opened, synchronize, reopened, ready_for_review ]
    # Documentation only changes do not run the suite
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      app_mode:
        description: 'URL mode: journal (one host per journal) or manager (journal code prefix, *-epi-manager branches)'
        type: choice
        options: [ journal, manager ]
        default: journal

# A new push to a pull request cancels the run of its previous commit
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Playwright E2E Tests (${{ (endsWith(github.base_ref, '-epi-manager') || inputs.app_mode == 'manager') && 'manager' || 'journal' }} mode, COI ${{ matrix.coi == '1' && 'enabled' || 'disabled' }}, shard ${{ matrix.shard }}/2)
    # Draft pull requests are not tested
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # The suite runs without the conflict of interest declaration on every pull request, and also with
    # it (a journal-wide setting, hence its own runners and databases) on pull requests targeting main
    # and on manual runs. Each mode is split into two shards running at the same time.
    strategy:
      fail-fast: false
      matrix:
        coi: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main') && '["0", "1"]' || '["0"]') }}
        shard: [ 1, 2 ]

    env:
      PWD_PATH: ${{ github.workspace }}/tests/config
      # URL mode, read by playwright.config.js (APP_MODE) and .github/scripts/e2e-router.php (E2E_APP_MODE):
      # - journal (staging, main): the journal is served at http://dev.episciences.org/; absolute URLs
      #   built by the application use https?://<rvcode>.episciences.org (DOMAIN constant)
      # - manager (*-epi-manager): the journal is served under its code, at
      #   http://manager-dev.episciences.org/dev/ (PREFIX_URL)
      # Both host names are resolved to the runner in /etc/hosts
      APP_MODE: ${{ (endsWith(github.base_ref, '-epi-manager') || inputs.app_mode == 'manager') && 'manager' || 'journal' }}
      E2E_APP_MODE: ${{ (endsWith(github.base_ref, '-epi-manager') || inputs.app_mode == 'manager') && 'manager' || 'journal' }}
      BASE_URL: ${{ (endsWith(github.base_ref, '-epi-manager') || inputs.app_mode == 'manager') && 'http://manager-dev.episciences.org/dev/' || 'http://dev.episciences.org/' }}
      E2E_RVCODE: dev
      MAILPIT_URL: http://127.0.0.1:8025/
      # PHP runs on the runner itself, not in the docker-compose container
      E2E_PHP_EXEC: php
      # Applied by app:e2e-seed (tests/e2e/global-setup.js)
      E2E_COI: ${{ matrix.coi }}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_episciences
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, xsl, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json, zip, curl
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # The public pages listing papers query Solr. The index stays empty: the suite does not run the
      # indexing worker. ICU fields of the configset need the analysis-extras module.
      - name: Start Solr
        run: |
          docker run --detach --name solr --publish 127.0.0.1:8983:8983 \
            --env SOLR_MODULES=analysis-extras \
            --volume "$PWD/src/solr/episciences:/opt/episciences-configset:ro" \
            solr:9.9 solr-precreate episciences /opt/episciences-configset

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P3306 --silent; do
            sleep 1
          done

      - name: Setup test database & config
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS test_episciences;"
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS test_episciences_auth;"
          # The development dataset: the dev journal with its repositories, settings and mail templates
          mysql -h 127.0.0.1 -P 3306 -u root -proot test_episciences < src/mysql/docker/episciences/dev-episciences.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot test_episciences_auth < tests/fixtures/schema-cas.sql
          php .github/scripts/setup-test-config.php
          # Public pages of the journal
          cp tests/fixtures/e2e-navigation.json data/dev/config/navigation.json

      - name: Serve the journal under its code (manager mode)
        if: env.APP_MODE == 'manager'
        run: |
          # The journal code is read from the first path segment only for the journals switched to the
          # new front-end (defineJournalConstants() in public/const.php)
          mysql -h 127.0.0.1 -P 3306 -u root -proot test_episciences \
            -e "UPDATE REVIEW SET is_new_front_switched = 'yes' WHERE CODE = '${E2E_RVCODE}';"
          # Base of the links built outside of a web request (command line scripts); Dotenv loads it into
          # $_ENV, .env.local overrides the tracked .env
          echo 'MANAGER_APPLICATION_URL=http://manager-dev.episciences.org' >> .env.local

      - name: Use the MySQL authentication adapter and the Solr container
        # The E2E accounts only exist in the local authentication database
        run: |
          php -r '
            $path = getenv("PWD_PATH") . "/pwd.json";
            $config = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
            $config["EPISCIENCES"]["AUTH_ADAPTER_NAME"] = "MYSQL";
            foreach (["INDEXING", "SEARCH"] as $use) {
              $config["ENDPOINTS"][$use . "_HOST"] = "127.0.0.1";
              $config["ENDPOINTS"][$use . "_PORT"] = 8983;
              $config["ENDPOINTS"][$use . "_PATH"] = "/solr";
            }
            $config["ENDPOINTS"]["CORENAME"] = "episciences";
            file_put_contents($path, json_encode($config, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          '

      - name: Create the Messenger queue tables
        # The development dataset leaves them to the queue command, as on every environment
        run: |
          php scripts/console.php episciences:queue --transport=solr_index --setup
          php scripts/console.php episciences:queue --transport=next_revalidation --setup

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install JS dependencies & Build assets
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Lint E2E tests
        run: yarn lint:e2e

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browsers only, not the system libraries they need
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Web Server
        run: |
          echo "127.0.0.1 dev.episciences.org manager-dev.episciences.org" | sudo tee -a /etc/hosts
          # Lets PHP listen on port 80 without running as root
          sudo setcap cap_net_bind_service=+ep "$(readlink -f "$(command -v php)")"
          # Upload limits of the php-fpm container (src/php-fpm/upload.ini): with the default 2M, the
          # submission form raises a notice before its redirect
          nohup php -d upload_max_filesize=16M -d post_max_size=32M \
            -S 127.0.0.1:80 -t public .github/scripts/e2e-router.php > /tmp/php-server.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error --output /dev/null "${BASE_URL}user/login"
        env:
          # The development environment does not require HTTPS for the session cookie
          APPLICATION_ENV: development
          # In manager mode the journal comes from the URL: a non-empty RVCODE disables the journal code prefix
          RVCODE: ${{ env.APP_MODE != 'manager' && 'dev' || '' }}

      # Indexes published papers in Solr, as the worker-solr-index service of docker-compose.yml: the
      # volume pages list the indexed papers
      - name: Start Solr Indexing Worker
        run: |
          nohup php scripts/console.php episciences:worker --transport=solr_index --time-limit=3600 \
            --memory-limit=512M > /tmp/solr-worker.log 2>&1 &
        env:
          APPLICATION_ENV: development
          RVCODE: dev

      - name: Wait for Solr
        run: |
          curl --retry 30 --retry-delay 2 --retry-all-errors --fail --silent --show-error --output /dev/null \
            'http://127.0.0.1:8983/solr/episciences/select?q=*:*&rows=0'

      # The global setup seeds the E2E accounts and cleans the journal (tests/e2e/global-setup.js)
      - name: Run Playwright Tests
        run: yarn test:e2e --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Show web server and application logs
        if: failure()
        run: |
          tail -n 200 /tmp/php-server.log
          echo '--- Solr indexing worker'
          tail -n 50 /tmp/solr-worker.log
          echo '--- Application logs'
          find tmp/test-logs -type f -exec tail -n 50 {} +

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ env.APP_MODE }}-coi-${{ matrix.coi }}-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
