name: Continuous Integration

on:
  pull_request:
    branches: [ main, preprod, preprod-epi-manager, main-epi-manager, staging ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches: [ main, preprod, preprod-epi-manager, main-epi-manager, staging ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.3-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Check PHP dependencies security (Composer Audit)
        run: composer audit --abandoned=ignore

      - name: No new test reading the application source
        run: php .github/scripts/check-source-reading-tests.php

      - name: No internal URL hardcoded from the web root (journal prefix)
        run: php .github/scripts/check-hardcoded-internal-urls.php

      - name: Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install JavaScript dependencies
        run: yarn install

      - name: Build frontend assets (Webpack Encore)
        run: yarn build

  js-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
          
      - name: Install JavaScript dependencies
        run: yarn install
        
      - name: Run JavaScript tests
        run: yarn test --coverage --watchAll=false --verbose
        
      - name: Upload JavaScript coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: javascript
          name: javascript-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  php-tests:
    name: PHP Tests (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']
    
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_episciences
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json, zip
          coverage: ${{ matrix.php-version == '8.3' && 'xdebug' || 'none' }}
          tools: composer:v2
          
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-
            
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
        
      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P3306 --silent; do
            sleep 1
          done
          
      - name: Setup test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS test_episciences;"
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS test_episciences_auth;"
          mysql -h 127.0.0.1 -P 3306 -u root -proot test_episciences < tests/fixtures/schema-episciences.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot test_episciences < tests/fixtures/seed.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot test_episciences_auth < tests/fixtures/schema-cas.sql

      - name: Setup test configuration
        run: php .github/scripts/setup-test-config.php
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: test_episciences
          DB_AUTH_NAME: test_episciences_auth

      - name: Cache PHPUnit result cache
        uses: actions/cache@v6
        with:
          path: .phpunit.cache
          key: ${{ runner.os }}-php${{ matrix.php-version }}-phpunit-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-phpunit-

      - name: Run PHP tests
        run: vendor/bin/phpunit ${{ matrix.php-version == '8.3' && '--coverage-clover=coverage-php.xml' || '--no-coverage' }}
        env:
          PWD_PATH: ${{ github.workspace }}/tests/config
          
      - name: Upload PHP coverage
        uses: codecov/codecov-action@v7
        if: matrix.php-version == '8.3'
        with:
          files: ./coverage-php.xml
          flags: php
          name: php-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration Status
    runs-on: ubuntu-latest
    needs: [code-quality, js-tests, php-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.code-quality.result }}" == "success" && "${{ needs.js-tests.result }}" == "success" && "${{ needs.php-tests.result }}" == "success" ]]; then
            echo "✅ All checks and tests passed!"
            exit 0
          else
            echo "❌ Some checks or tests failed:"
            echo "  Code quality: ${{ needs.code-quality.result }}"
            echo "  PHP tests: ${{ needs.php-tests.result }}"
            echo "  JavaScript tests: ${{ needs.js-tests.result }}"
            exit 1
          fi
          
      - name: Comment on PR
        uses: actions/github-script@v9
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          script: |
            const MARKER = '<!-- ci-test-results -->';

            const qualityResult = '${{ needs.code-quality.result }}';
            const phpResult = '${{ needs.php-tests.result }}';
            const jsResult = '${{ needs.js-tests.result }}';

            let message = MARKER + '\n## Test Results\n\n';
            message += qualityResult === 'success' ? '✅ Code Quality & Build: Passed\n' : '❌ Code Quality & Build: Failed\n';
            message += phpResult === 'success' ? '✅ PHP Tests: Passed\n' : '❌ PHP Tests: Failed\n';
            message += jsResult === 'success' ? '✅ JavaScript Tests: Passed\n' : '❌ JavaScript Tests: Failed\n';

            if (qualityResult === 'success' && phpResult === 'success' && jsResult === 'success') {
              message += '\n🎉 All tests and checks are passing! Ready to merge.';
            } else {
              message += '\n🔍 Please check the failed checks before merging.';
            }

            message += `\n\n<sub>Last updated for ${context.sha.substring(0, 7)}.</sub>`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: message,
              });
            }
