# Opt-in override that turns Xdebug step-debugging back on for the php-fpm
# service. The base docker-compose.yml ships with XDEBUG_MODE=off so that every
# PHP process (tests, console, cron) runs without Xdebug overhead or the stderr
# noise that breaks phpunit's #[RunInSeparateProcess] tests.
#
# Use when you need to step-debug:
#   make up-xdebug
# which also loads docker-compose.override.yml when present, as plain
#   docker compose -f docker-compose.yml -f docker-compose.xdebug.yml up
# does not.
#
# These keys override the base file's environment (compose merges by key, the
# later file wins).
services:
  php-fpm:
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
      # Lets the IDE pick its server configuration (and path mappings) by name only:
      # Apache listens on port 80 behind Traefik, so the port PHP reports never matches
      # a server declared on 443. Also used when debugging console scripts.
      - PHP_IDE_CONFIG=serverName=dev.episciences.org
