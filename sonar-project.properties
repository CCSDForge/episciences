# SonarQube configuration file for Episciences GPL
# This file is used by sonar-scanner to run code analysis.

# SonarQube Server URL
# Default local URL (used when running the scanner from the host).
sonar.host.url=http://localhost:9000

# Project Identification
sonar.projectKey=episciences-gpl
sonar.projectName=Episciences GPL

# Paths to the source directories
# Analyzes application logic, libraries, sources, and public JS files
sonar.sources=application,library,public,src

# Exclusions from source analysis
sonar.exclusions=vendor/**,node_modules/**,public/dist/**,public/node_modules/**,build/**,cache/**,data/**,logs/**,tmp/**

# Paths to the test directories
sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php,tests/**/*.js

# Source files encoding
sonar.sourceEncoding=UTF-8

# Test execution reports path (generated by PHPUnit)
sonar.php.tests.reportPath=build/junit.xml

# PHP Code Coverage report path (generated by PHPUnit)
sonar.php.coverage.reportPaths=build/coverage.xml

# JavaScript Code Coverage report path (generated by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
